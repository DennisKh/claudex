name: Publish

# release-please publishes a GitHub release when its release PR merges, which
# is the only thing that ever puts a version on Hex.
on:
  release:
    types: [published]

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: "28.5"
          elixir-version: "1.19.5"

      - run: mix deps.get

      - run: mix format --check-formatted

      - run: mix compile --warnings-as-errors

      - run: mix credo --strict

      - run: mix test

  publish:
    name: Publish to Hex
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"
          elixir-version: "1.19.5"

      - run: mix deps.get

      # A tag whose mix.exs says something else would publish the wrong
      # version under the right name, and Hex releases can't be replaced.
      - name: Check mix.exs matches the tag
        run: |
          tag="${{ github.event.release.tag_name }}"
          version=$(mix run --no-start -e 'IO.puts(Mix.Project.config()[:version])')
          if [ "v$version" != "$tag" ]; then
            echo "tag $tag does not match mix.exs version $version"
            exit 1
          fi

      - name: Publish package and docs
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes
